name: Keep Supabase Alive

# Supabase 무료 플랜은 7일간 DB 접근이 없으면 프로젝트가 자동 일시정지된다.
# 주 2회(월/목) 배포된 백엔드의 DB 조회 엔드포인트를 호출해 활성 상태를 유지한다.
on:
  schedule:
    - cron: '0 3 * * 1,4'   # 매주 월/목 03:00 UTC = 12:00 KST
  workflow_dispatch: {}       # 수동 실행 버튼 (필요 시 즉시 확인용)

jobs:
  ping-db:
    name: Ping DB
    runs-on: ubuntu-latest
    steps:
      - name: DB 조회 엔드포인트 호출 (existsByEmail — 부작용 없는 SELECT)
        run: |
          res=$(curl -s -o /tmp/body.json -w '%{http_code}' \
            "https://www.cura-ewha.kr/api/v1/auth/email-exists?email=keepalive@cura-ewha.kr")
          echo "HTTP $res"
          cat /tmp/body.json
          if [ "$res" != "200" ]; then
            echo "::error::keepalive 호출 실패 (HTTP $res) — 백엔드 또는 DB 상태 확인 필요"
            exit 1
          fi
